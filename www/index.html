<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сверка маркировки</title>
<style>
:root{--bg:#f6f7f5;--surface:#fff;--text:#1b1f1c;--muted:#66706a;--line:#dfe3df;
--ok:#1f9d55;--bad:#d64545;--dup:#e8b400;--idle:#6b756f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121513;--surface:#1c211e;--text:#e9ede9;--muted:#9aa59e;--line:#2c332f;color-scheme:dark}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:10px}
h2{font-size:15px;margin:0 0 8px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:100px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
select,button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
button[hidden]{display:none}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}

#cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:8px solid var(--idle);transition:border-color .08s}
#cam[data-st=ok]{border-color:var(--ok)}#cam[data-st=bad]{border-color:var(--bad)}#cam[data-st=dup]{border-color:var(--dup)}
#video{width:100%;height:100%;object-fit:cover;display:block}
#hl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#off[hidden]{display:none!important}
#off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;padding:20px;text-align:center}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.stat{text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.dup b{color:var(--dup)}
.scroll{max-height:240px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 6px;border-bottom:1px solid var(--line);word-break:break-all}
td.t{white-space:nowrap;color:var(--muted)}
tr.ok td.s{color:var(--ok)}tr.bad td.s{color:var(--bad)}tr.dup td.s{color:var(--dup)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
#camMsg{color:var(--bad);font-size:14px;margin:6px 0 0}
</style>
</head>
<body>
<main>

<section>
<div id="cam" data-st="idle">
<video id="video" playsinline muted></video>
<canvas id="hl"></canvas>
<div id="off">Камера выключена</div>
</div>
<div id="camMsg"></div>
<div class="hint" id="dbg"></div>
<div class="row">
<button class="primary" id="btnCam">Включить камеру</button>
<button id="btnTorch" hidden>Фонарик</button>
<select id="qual" title="Размер кадра"><option value="960">Быстро</option><option value="1280">Точнее (мелкие коды)</option></select>
<label class="chk"><input type="checkbox" id="snd" checked>Звук</label>
</div>
<div class="stats">
<div class="stat"><b id="nExp">0</b><span>в фактуре</span></div>
<div class="stat ok"><b id="nOk">0</b><span>проверено</span></div>
<div class="stat bad"><b id="nBad">0</b><span>пересорт</span></div>
<div class="stat dup"><b id="nDup">0</b><span>дубли</span></div>
<div class="stat"><b id="nLeft">0</b><span>осталось</span></div>
</div>
</section>

<section>
<h2>Коды из фактуры</h2>
<textarea id="invoice" placeholder="Вставьте коды из фактуры, по одному в строке"></textarea>
<div class="row">
<button class="primary" id="btnLoad">Загрузить фактуру</button>
<button id="btnFile">Из файла (.txt, .csv)</button>
<input type="file" id="file" accept=".txt,.csv" hidden>
</div>
<p class="hint" id="invInfo">Верным считается код ровно из 31 символа. Криптохвост не учитывается.</p>
</section>

<section>
<h2>Ввод вручную</h2>
<input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Код и Enter">
<div class="row"><button id="btnExport">Скачать отчёт (CSV)</button><button id="btnReset">Сбросить сверку</button></div>
</section>

<section>
<h2>Журнал</h2>
<div class="scroll"><table><tbody id="log"></tbody></table></div>
</section>

<section>
<h2>Не отсканированы</h2>
<div class="scroll"><table><tbody id="left"></tbody></table></div>
</section>

<section id="badSec" hidden>
<h2>Ошибки в фактуре (длина не 31)</h2>
<div class="scroll"><table><tbody id="badInvT"></tbody></table></div>
</section>
<p class="hint" style="text-align:center">Версия 5: мультисканер, строго 31 символ</p>
</main>

<script src="zxing.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const expected=new Set();      // коды из фактуры (ровно 31 символ)
const badInv=new Map();        // первые 31 символ -> реальная длина (ошибка поставщика)
let seen=new Set(),log=[],nBad=0,nDup=0;

/* ---------- разбор кода: берём только часть до криптохвоста ---------- */
function parse(raw,strict){
  let s=String(raw||"").replace(/^\]d2/i,"").replace(/\u241d/g,"\u001d")
    .replace(/[()\s]/g,"").replace(/[\u0000-\u001c\u001e\u001f]/g,"").replace(/^\u001d+/,"");
  if(!s)return null;
  const g=s.indexOf("\u001d");
  let head;
  if(g>=0)head=s.slice(0,g);
  else if(!strict&&s.length>31&&s.slice(31,33)==="91")head=s.slice(0,31);
  else head=s;
  if(!head)return null;
  return {head,len:head.length,ok:head.length===31};
}

/* ---------- звук ---------- */
let AC=null;
function beep(f,d){
  if(!$("snd").checked)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.value=.18;o.start();o.stop(AC.currentTime+d)}catch(e){}
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function feedback(st){
  if(st==="bad"){beep(200,.4);vib(200)}
  else if(st==="dup"){beep(520,.18);vib([50,50,50])}
  else if(st==="ok"){beep(900,.07);vib(30)}
}
function show(st){$("cam").dataset.st=st}

/* ---------- фактура ---------- */
function loadInvoice(text){
  expected.clear();badInv.clear();seen=new Set();log=[];nBad=0;nDup=0;
  text.split(/\r?\n/).forEach(l=>{
    const p=parse(l,true);if(!p)return;
    if(p.ok)expected.add(p.head);else badInv.set(p.head.slice(0,31),p.len);
  });
  $("invInfo").textContent="Кодов: "+expected.size+". Ошибок длины в фактуре: "+badInv.size+".";
  show("idle");render();
}

/* ---------- проверка одного кода; возвращает ok / dup / bad ---------- */
function check(raw){
  const p=parse(raw);if(!p)return null;
  if(!expected.size&&!badInv.size){$("camMsg").textContent="Сначала загрузите фактуру";return "bad"}
  $("camMsg").textContent="";
  let st,why;
  if(!p.ok){st="bad";why="неверная длина ("+p.len+")"}
  else if(seen.has(p.head)){st="dup";why="дубликат"}
  else if(expected.has(p.head)){st="ok";seen.add(p.head);why="проверено"}
  else if(badInv.has(p.head)){st="bad";why="ошибка в фактуре (длина "+badInv.get(p.head)+")"}
  else{st="bad";why="пересорт"}
  if(st==="bad")nBad++;if(st==="dup")nDup++;
  show(st);
  log.unshift({time:new Date().toLocaleTimeString("ru-RU"),code:p.head,st,why});
  return st;
}

function render(){
  $("nExp").textContent=expected.size;$("nOk").textContent=seen.size;
  $("nBad").textContent=nBad;$("nDup").textContent=nDup;$("nLeft").textContent=expected.size-seen.size;
  const lg=$("log");lg.innerHTML="";
  log.slice(0,150).forEach(r=>{const tr=document.createElement("tr");tr.className=r.st;
    [["t",r.time],["",r.code],["s",r.why]].forEach(([c,v])=>{const td=document.createElement("td");if(c)td.className=c;td.textContent=v;tr.append(td)});lg.append(tr)});
  const lf=$("left");lf.innerHTML="";let i=0;
  for(const c of expected){if(!seen.has(c)){if(i++>=200)break;const tr=document.createElement("tr"),td=document.createElement("td");td.textContent=c;tr.append(td);lf.append(tr)}}
  const bi=$("badInvT");bi.innerHTML="";
  badInv.forEach((len,k)=>{const tr=document.createElement("tr");[k,"длина "+len].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});bi.append(tr)});
  $("badSec").hidden=!badInv.size;
}

/* ---------- мультискан: на кадре находятся участки с плотной «шашечной» текстурой (DataMatrix), каждый участок читается отдельно и параллельно ---------- */
/*TILES-START*/
function toGray(d,n){const g=new Uint8Array(n);for(let i=0,p=0;i<n;i++,p+=4)g[i]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8;return g}
function density(g,FW,FH){
  const B=8,bw=Math.floor(FW/B),bh=Math.floor(FH/B),c=new Uint16Array(bw*bh);
  for(let y=0;y<bh*B-1;y++){
    const row=(y/B|0)*bw;let p=y*FW;
    for(let x=0;x<bw*B-1;x++,p++){const v=g[p];if(Math.abs(v-g[p+1])+Math.abs(v-g[p+FW])>40)c[row+(x/B|0)]++}
  }
  return {c,bw,bh,B};
}
function boxesAt(D,thr,FW,FH){
  const {c,bw,bh,B}=D,m=new Uint8Array(bw*bh),m2=new Uint8Array(bw*bh),lim=thr*B*B,out=[];
  for(let i=0;i<m.length;i++)m[i]=c[i]>lim?1:0;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    let v=0;
    for(let dy=-1;dy<=1&&!v;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<bw&&yy<bh&&m[yy*bw+xx]){v=1;break}}
    m2[y*bw+x]=v;
  }
  const seen=new Uint8Array(bw*bh);
  for(let s0=0;s0<m2.length;s0++){
    if(!m2[s0]||seen[s0])continue;
    let x0=bw,y0=bh,x1=0,y1=0;const st=[s0];seen[s0]=1;
    while(st.length){
      const i=st.pop(),x=i%bw,y=(i/bw)|0;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      const nb=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
      for(const [a,b] of nb){if(a>=0&&b>=0&&a<bw&&b<bh){const j=b*bw+a;if(m2[j]&&!seen[j]){seen[j]=1;st.push(j)}}}
    }
    const w=(x1-x0+1)*B,h=(y1-y0+1)*B,r=w/h;
    if(w<40||h<40||w>FW*0.95||h>FH*0.95||r<0.45||r>2.2)continue;
    out.push([x0*B,y0*B,w,h]);
  }
  return out;
}
function makeRegions(d,FW,FH){
  const g=toGray(d,FW*FH),D=density(g,FW,FH);
  const all=boxesAt(D,0.28,FW,FH).concat(boxesAt(D,0.42,FW,FH)),keep=[];
  for(const b of all){
    if(keep.some(k=>Math.abs(k[0]-b[0])<k[2]*0.2&&Math.abs(k[1]-b[1])<k[3]*0.2&&Math.abs(k[2]-b[2])<k[2]*0.25))continue;
    keep.push(b);
  }
  const tiles=[];
  for(const [bx,by,bw0,bh0] of keep.slice(0,80)){
    const mx=Math.round(bw0*0.12),my=Math.round(bh0*0.12);
    const x=Math.max(0,bx-mx),y=Math.max(0,by-my),w=Math.min(FW-x,bw0+2*mx),h=Math.min(FH-y,bh0+2*my);
    const lum=new Uint8ClampedArray(w*h);
    for(let yy=0;yy<h;yy++)lum.set(g.subarray((y+yy)*FW+x,(y+yy)*FW+x+w),yy*w);
    tiles.push({x,y,w,h,lum});
  }
  return tiles;
}
let mainReader=null;
function decodeLocal(tiles){
  mainReader=mainReader||new ZXing.DataMatrixReader();
  const out=[];
  for(const t of tiles){
    try{
      const r=mainReader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(t.lum,t.w,t.h))));
      out.push({text:r.getText(),pts:r.getResultPoints().map(p=>[p.getX(),p.getY()]),x:t.x,y:t.y});
    }catch(e){}
  }
  return out;
}
/*TILES-END*/

const WSRC=`
let R=null;
onmessage=e=>{
  const d=e.data;
  if(d.init){try{importScripts(d.url);R=new ZXing.DataMatrixReader()}catch(err){postMessage({fail:1})}return}
  const out=[];
  if(R){for(const t of d.tiles){
    try{
      const r=R.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(t.lum,t.w,t.h))));
      out.push({text:r.getText(),pts:r.getResultPoints().map(p=>[p.getX(),p.getY()]),x:t.x,y:t.y});
    }catch(err){}
  }}
  postMessage({id:d.id,out});
};`;
let pool=[],poolOk=false,rid=0;
function initPool(){
  if(pool.length)return;
  try{
    const url=URL.createObjectURL(new Blob([WSRC],{type:"text/javascript"}));
    const n=Math.max(2,Math.min(4,(navigator.hardwareConcurrency||4)-1));
    const zx=new URL("zxing.min.js",location.href).href;
    for(let i=0;i<n;i++){
      const w=new Worker(url);
      w.onerror=()=>{poolOk=false};
      w.addEventListener("message",e=>{if(e.data&&e.data.fail)poolOk=false});
      w.postMessage({init:1,url:zx});pool.push(w);
    }
    poolOk=true;
  }catch(e){poolOk=false}
}
function runTiles(tiles){
  if(!poolOk)return Promise.resolve(decodeLocal(tiles));
  return new Promise(res=>{
    const id=++rid,n=pool.length,parts=Array.from({length:n},()=>[]);
    tiles.forEach((t,i)=>parts[i%n].push(t));
    let left=0,all=[];
    const timer=setTimeout(()=>res(all),1500);
    pool.forEach((w,i)=>{
      if(!parts[i].length)return;left++;
      w.onmessage=e=>{
        if(e.data.fail){poolOk=false;return}
        if(e.data.id!==id)return;
        all=all.concat(e.data.out);
        if(--left===0){clearTimeout(timer);res(all)}
      };
      w.postMessage({id,tiles:parts[i]},parts[i].map(t=>t.lum.buffer));
    });
    if(!left){clearTimeout(timer);res(all)}
  });
}

/* ---------- отслеживание кодов в кадре и подсветка ---------- */
const trk=new Map(); // ключ кода -> {st,box,t}
const HLC={ok:"31,157,85",bad:"214,69,69",dup:"232,180,0"};
const RANK={ok:1,dup:2,bad:3};
function onResults(out,FW,vw){
  const k=vw/FW,now=Date.now(),done=new Set();
  let worst=null;
  for(const r of out){
    if(done.has(r.text))continue;done.add(r.text);
    const p=parse(r.text);if(!p)continue;
    const key=p.ok?p.head:"x"+r.text;
    const xs=r.pts.map(q=>(r.x+q[0])*k),ys=r.pts.map(q=>(r.y+q[1])*k);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),pad=(x1-x0)*0.06;
    const box=[x0-pad,y0-pad,x1+pad,y1+pad];
    const e=trk.get(key);
    if(e&&now-e.t<1200){e.t=now;e.box=box;continue} // тот же код всё ещё в кадре
    const st=check(r.text);if(!st)continue;
    trk.set(key,{st,box,t:now});
    if(!worst||RANK[st]>RANK[worst])worst=st;
  }
  if(worst){feedback(worst);render()}
  trk.forEach((e,key)=>{if(now-e.t>3000)trk.delete(key)});
  return done.size;
}
function drawHL(){
  const c=$("hl"),v=$("video"),cw=c.clientWidth,ch=c.clientHeight;
  if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}
  const g=c.getContext("2d");g.clearRect(0,0,cw,ch);
  if(!v.videoWidth)return;
  const k=Math.max(cw/v.videoWidth,ch/v.videoHeight),ox=(cw-v.videoWidth*k)/2,oy=(ch-v.videoHeight*k)/2,now=Date.now();
  trk.forEach(e=>{
    if(now-e.t>450||!HLC[e.st])return;
    const x=ox+e.box[0]*k,y=oy+e.box[1]*k,w=(e.box[2]-e.box[0])*k,h=(e.box[3]-e.box[1])*k;
    g.fillStyle="rgba("+HLC[e.st]+",.45)";g.fillRect(x,y,w,h);
    g.lineWidth=5;g.strokeStyle="rgb("+HLC[e.st]+")";g.strokeRect(x,y,w,h);
  });
}

/* ---------- камера ---------- */
let stream=null,track=null,running=false,torchOn=false,cv=null,cx=null,wake=null;
async function loop(){
  let frames=0,fpsT=Date.now(),inFrame=0;
  while(running){
    const v=$("video");
    if(v.videoWidth){
      const FW=Math.min(+$("qual").value,v.videoWidth),FH=Math.round(FW*v.videoHeight/v.videoWidth);
      if(cv.width!==FW||cv.height!==FH){cv.width=FW;cv.height=FH}
      cx.drawImage(v,0,0,FW,FH);
      const tiles=makeRegions(cx.getImageData(0,0,FW,FH).data,FW,FH);
      let out=[];
      try{out=await runTiles(tiles)}catch(e){}
      if(!running)break;
      inFrame=onResults(out,FW,v.videoWidth);
      drawHL();
      frames++;
      const now=Date.now();
      if(now-fpsT>=1000){$("dbg").textContent="Кадров в секунду: "+frames+" · кодов в кадре: "+inFrame+(poolOk?"":" · режим без потоков");frames=0;fpsT=now}
    }
    await new Promise(r=>setTimeout(r,0));
  }
}
async function camStart(){
  $("camMsg").textContent="";
  try{
    if(!window.ZXing)throw new Error("библиотека распознавания не загрузилась");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});
    const v=$("video");v.srcObject=stream;await v.play();
    track=stream.getVideoTracks()[0];
    try{const cap=track.getCapabilities?track.getCapabilities():{};
      if(cap.focusMode&&cap.focusMode.includes("continuous"))await track.applyConstraints({advanced:[{focusMode:"continuous"}]});
      $("btnTorch").hidden=!cap.torch}catch(e){}
    cv=document.createElement("canvas");cx=cv.getContext("2d",{willReadFrequently:true});
    initPool();
    try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}
    $("off").hidden=true;$("btnCam").textContent="Выключить камеру";
    show("idle");running=true;loop();
  }catch(e){
    camStop();$("camMsg").textContent="Камера не запустилась: "+(e&&e.message?e.message:e)+". Проверьте разрешение камеры в настройках телефона.";
  }
}
function camStop(){
  running=false;torchOn=false;trk.clear();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  track=null;$("video").srcObject=null;$("off").hidden=false;$("btnTorch").hidden=true;
  $("btnCam").textContent="Включить камеру";
  try{wake&&wake.release()}catch(e){}wake=null;
  const c=$("hl");c.getContext("2d").clearRect(0,0,c.width,c.height);
}
$("btnCam").onclick=()=>{running?camStop():camStart()};
$("btnTorch").onclick=async()=>{try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]})}catch(e){}};

/* ---------- прочее ---------- */
$("btnLoad").onclick=()=>loadInvoice($("invoice").value);
$("btnFile").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{$("invoice").value=r.result;loadInvoice(r.result)};r.readAsText(f)};
$("code").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const v=$("code").value;$("code").value="";const st=check(v);if(st){feedback(st);render()}}});

let armed=null;
$("btnReset").onclick=()=>{
  const b=$("btnReset");
  if(!armed){b.textContent="Нажмите ещё раз для сброса";armed=setTimeout(()=>{armed=null;b.textContent="Сбросить сверку"},4000);return}
  clearTimeout(armed);armed=null;b.textContent="Сбросить сверку";
  seen=new Set();log=[];nBad=0;nDup=0;trk.clear();
  show("idle");render();
};
$("btnExport").onclick=()=>{
  const rows=[["время","код","статус"]];
  log.slice().reverse().forEach(r=>rows.push([r.time,r.code,r.why]));
  expected.forEach(c=>{if(!seen.has(c))rows.push(["",c,"не отсканирован"])});
  badInv.forEach((len,k)=>rows.push(["",k,"в фактуре длина "+len]));
  const csv="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="sverka.csv";a.click();
};
render();
</script>
</body>
</html>
