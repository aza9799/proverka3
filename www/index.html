<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сверка маркировки</title>
<style>
:root{--bg:#f6f7f5;--surface:#fff;--text:#1b1f1c;--muted:#66706a;--line:#dfe3df;--accent:#2f7de1;
--ok:#1f9d55;--bad:#d64545;--dup:#e8b400;--grp:#3b82f6;--idle:#6b756f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--surface:#16202b;--text:#e9eef4;--muted:#8b98a6;--line:#25313e;--accent:#5aa2ff;color-scheme:dark}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:10px}
main[hidden]{display:none}
h1{font-size:20px;margin:6px 2px 10px}
h2{font-size:15px;margin:0 0 8px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
textarea{min-height:100px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
select,button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.big{width:100%;padding:15px;font-size:18px;font-weight:700;border-radius:12px;margin-bottom:12px}
button.sm{padding:6px 10px;font-size:13px}
button[hidden]{display:none}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
details summary{cursor:pointer;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.bar button{padding:8px 14px;font-size:18px}
.ttl{font-weight:700;font-size:17px;line-height:1.25}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.card .t{font-weight:700}.card .s{color:var(--muted);font-size:13px;margin-top:2px}
.pb{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent)}
.pb.done i{background:var(--ok)}
.prow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:8px;cursor:pointer}
.prow.part{border-left-color:var(--dup)}.prow.done{border-left-color:var(--ok)}.prow.err{border-left-color:var(--bad)}
.prow .pm{flex:1;min-width:0}.prow .pn{font-weight:600;line-height:1.25;word-break:break-word}
.prow .pc{white-space:nowrap;font-size:13px;color:var(--muted)}.prow .pc b{font-size:18px;color:var(--text)}
.empty{height:160px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-12px -12px 0}
.tab{flex:1;padding:13px 2px;text-align:center;font-weight:600;font-size:13px;border:0;background:none;border-bottom:3px solid transparent;color:var(--muted);border-radius:0}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[data-t=ok].on{color:var(--ok);border-bottom-color:var(--ok)}
.tab[data-t=bad].on{color:var(--bad);border-bottom-color:var(--bad)}
#tabBody{min-height:200px;max-height:48vh;overflow:auto;padding-top:6px}
.item{display:flex;justify-content:space-between;gap:10px;padding:8px 4px 8px 8px;border-bottom:1px solid var(--line);font-size:13px;border-left:4px solid var(--line)}
.item code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.item span{color:var(--muted);text-align:right}
.item.ok{border-left-color:var(--ok)}.item.bad{border-left-color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:rgba(20,24,22,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;display:none}

#camfull{position:fixed;inset:0;z-index:50;background:#000;touch-action:none}
#camfull[hidden]{display:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ring{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 transparent;transition:box-shadow .08s}
#camfull[data-st=ok] .ring{box-shadow:inset 0 0 0 10px var(--ok)}
#camfull[data-st=bad] .ring{box-shadow:inset 0 0 0 10px var(--bad)}
#camfull[data-st=dup] .ring{box-shadow:inset 0 0 0 10px var(--dup)}
#camfull[data-st=grp] .ring{box-shadow:inset 0 0 0 10px var(--grp)}
#topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 12px;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));text-align:center}
#camTitle{color:#fff;font-weight:700;font-size:15px;margin-bottom:8px;text-shadow:0 1px 3px #000}
.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:20px;padding:5px 11px;font-size:13px;white-space:nowrap}
.pill b{font-size:17px;margin-right:4px}
.pill.ok b{color:#4fe08c}.pill.bad b{color:#ff7b7b}.pill.dup b{color:#ffd23f}
#camMsg{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 96px);text-align:center;color:#fff;background:rgba(214,69,69,.92);border-radius:10px;padding:8px 10px;font-size:14px}
#camMsg.info{background:rgba(59,130,246,.92)}
#camMsg:empty{display:none}
#botbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.75))}
#botbar button,#botbar select{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3)}
#botbar option{color:#000}
#botbar label.chk{color:#fff}
#dbg{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);text-align:center;color:rgba(255,255,255,.75);font-size:12px}
html.barcode-scanner-active,body.barcode-scanner-active{background:transparent!important;color-scheme:normal!important}
body.barcode-scanner-active main{display:none}
body.barcode-scanner-active #camfull{background:transparent}
body.barcode-scanner-active #video{display:none}
</style>
</head>
<body>
<main id="vHome">
<h1>Фактуры</h1>
<section>
<h2>Загрузить фактуру</h2>
<input type="text" id="docTitle" placeholder="Название (необязательно): поставщик, номер">
<textarea id="invoice" placeholder="Вставьте текст фактуры (товары и коды) или выберите файл"></textarea>
<div class="row">
<button class="primary" id="btnLoad">Создать документ</button>
<button id="btnFile">Из файла (.txt)</button>
<input type="file" id="file" accept=".txt,.csv,text/plain" hidden>
</div>
<p class="hint" id="loadMsg"></p>
</section>
<div id="docList"></div>
<p class="hint" style="text-align:center">Версия 8: сверка потребительских и групповых кодов</p>
</main>

<main id="vDoc" hidden>
<div class="bar"><button id="bkHome">←</button><div><div class="ttl" id="docName"></div><div class="sub" id="docSum"></div></div></div>
<input type="text" id="search" placeholder="поиск по товару">
<div id="prodList"></div>
<section>
<details>
<summary>Отчёт и ошибки в фактуре</summary>
<div class="row" style="margin-top:10px"><button class="sm" id="btnRepCopy">Копировать отчёт</button><button class="sm" id="btnRepCsv">Скачать CSV</button></div>
<div id="invErr" class="hint"></div>
</details>
</section>
</main>

<main id="vProd" hidden>
<div class="bar"><button id="bkDoc">←</button><div><div class="ttl" id="prodName"></div><div class="sub" id="prodSum"></div></div></div>
<button class="primary big" id="btnScanProd">Сканировать</button>
<p class="hint" style="margin:-4px 2px 10px">Групповой код сейчас засчитывается как один код. Сколько упаковок внутри, станет известно после подключения Xtrace.</p>
<section>
<div class="tabs">
<button class="tab on" data-t="ok" id="tOk">Проверено (0)</button>
<button class="tab" data-t="left" id="tLeft">Не проверено (0)</button>
<button class="tab" data-t="bad" id="tBad">Пересорт (0)</button>
</div>
<div id="tabBody"></div>
<div class="row">
<button class="sm" id="btnCpOk">Копировать проверенные</button>
<button class="sm" id="btnCpLeft">Копировать не проверенные</button>
<button class="sm" id="btnCpBad">Копировать пересорт</button>
</div>
</section>
<section>
<details><summary>Ввод кода вручную</summary>
<div style="margin-top:10px"><input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Код и Enter"></div>
</details>
</section>
</main>

<div id="camfull" data-st="idle" hidden>
<video id="video" playsinline muted></video>
<canvas id="hl"></canvas>
<div class="ring"></div>
<div id="topbar">
<div id="camTitle"></div>
<div class="pills">
<div class="pill ok"><b id="cOk">0</b>проверено</div>
<div class="pill bad"><b id="cBad">0</b>пересорт</div>
<div class="pill dup"><b id="cDup">0</b>дубли</div>
<div class="pill"><b id="cLeft">0</b>осталось</div>
</div>
</div>
<div id="camMsg"></div>
<div id="dbg"></div>
<div id="botbar">
<input type="range" id="zoom" min="1" max="4" step="0.1" value="1" hidden style="width:90%">
<button id="btnClose">Закрыть</button>
<button id="btnTorch" hidden>Фонарик</button>
<select id="qual" title="Размер кадра"><option value="960">Быстро</option><option value="1280">Точнее</option><option value="1920" selected>Дальше</option></select>
<label class="chk"><input type="checkbox" id="snd" checked>Звук</label>
</div>
</div>
<div id="toast"></div>

<script src="native.bundle.js"></script>
<script src="zxing.min.js"></script>
<script>
const $=id=>document.getElementById(id);

/* ---------- хранение: документы живут на телефоне ---------- */
const KEY="markscan.docs.v1";
let docs=[];
try{docs=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){docs=[]}
docs.forEach(d=>d.products.forEach(p=>{p.group=p.group||[];p.gseen=p.gseen||{}}));
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(docs))}catch(e){}},500)}
const cache=new Map();
function dc(doc){
  let c=cache.get(doc.id);
  if(!c){c={owner:new Map(),sets:[],gowner:new Map(),gsets:[]};
    doc.products.forEach((p,i)=>{c.sets[i]=new Set(p.codes);p.codes.forEach(code=>c.owner.set(code,i));c.gsets[i]=new Set(p.group);p.group.forEach(g=>c.gowner.set(g,i))});
    cache.set(doc.id,c)}
  return c;
}
let curDoc=null,curProd=null,curIdx=-1,view="home";
const ps=p=>({tot:p.codes.length+p.group.length,ok:Object.keys(p.seen).length+Object.keys(p.gseen).length,bad:Object.keys(p.bad).length,dup:Object.keys(p.dup).length});
const pg=p=>({c:p.codes.length,cok:Object.keys(p.seen).length,g:p.group.length,gok:Object.keys(p.gseen).length});

/* ---------- разбор кода: берём только часть до криптохвоста ---------- */
function parse(raw,strict){
  let s=String(raw||"").replace(/^\]d2/i,"").replace(/\u241d/g,"\u001d")
    .replace(/[()\s]/g,"").replace(/[\u0000-\u001c\u001e\u001f]/g,"").replace(/^\u001d+/,"");
  if(!s)return null;
  const g=s.indexOf("\u001d");
  let head;
  if(g>=0)head=s.slice(0,g);
  else if(!strict&&s.length>31&&s.slice(31,33)==="91")head=s.slice(0,31);
  else head=s;
  if(!head)return null;
  return {head,len:head.length,ok:head.length===31};
}

/* ---------- разбор файла фактуры: товар -> его коды ---------- */
function normGrp(s){let t=String(s||"").replace(/[()\s\u001d]/g,"");if(/^\d{18}$/.test(t))t="00"+t;return t}
function parseInvoice(text){
  const prods=[],errors=[];let cur=null,sec="c";
  const mk=(name,cat)=>{const p={name,cat:cat||"",codes:[],seen:{},bad:{},dup:{},group:[],gseen:{}};prods.push(p);return p};
  for(const raw of String(text).split(/\r?\n/)){
    const l=raw.replace(/\u00a0/g," ").trim();
    if(!l)continue;
    if(/^Потребительская/i.test(l)){sec="c";continue}
    if(/^Групповая/i.test(l)){sec="g";continue}
    if(/^Транспортная/i.test(l)){sec="t";continue}
    if(/\s/.test(l)){ // строка с пробелами или табами: заголовок товара
      const parts=l.split(/\t+/).map(x=>x.trim()).filter(Boolean);
      let name,cat="";
      if(parts.length>=2&&/^\d+$/.test(parts[0])){name=parts[1];cat=parts[2]||""}
      else{const m=l.match(/^\d+[\s.)]+(.+)$/);name=m?m[1]:l}
      cur=mk(name,cat);sec="c";continue;
    }
    if(!cur)cur=mk("Без названия","");
    if(sec==="c"){
      const p=parse(l,true);if(!p)continue;
      if(p.ok){if(!cur.codes.includes(p.head))cur.codes.push(p.head)}
      else errors.push({prod:cur.name,code:p.head,len:p.len});
    }else{const g=normGrp(l);if(g&&!cur.group.includes(g))cur.group.push(g)}
  }
  return {prods:prods.filter(p=>p.codes.length||p.group.length),errors};
}
function createDoc(text,title){
  const r=parseInvoice(text);
  if(!r.prods.length)return null;
  const d=new Date();
  const doc={id:d.getTime().toString(36),title:title||("Фактура "+d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})),
    created:d.toISOString(),products:r.prods,errors:r.errors,sscc:{}};
  docs.unshift(doc);save();return doc;
}

/* ---------- звук ---------- */
let AC=null;
function beep(f,d){
  if(!$("snd").checked)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.value=.18;o.start();o.stop(AC.currentTime+d)}catch(e){}
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function feedback(st){
  if(st==="bad"){beep(200,.4);vib(200)}
  else if(st==="dup"){beep(520,.18);vib([50,50,50])}
  else if(st==="ok"){beep(900,.07);vib(30)}
  else if(st==="grp"){beep(700,.12);vib(60)}
}
function show(st){$("camfull").dataset.st=st}
let flashT=null;
function flash(msg,kind){
  const m=$("camMsg");m.textContent=msg;m.className=kind||"";
  clearTimeout(flashT);flashT=setTimeout(()=>{m.textContent=""},2600);
}
let toastT=null;
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display="none"},1800)}

/* ---------- проверка кода внутри выбранного товара: ok / dup / bad / grp ---------- */
function check(raw){
  if(!curDoc||!curProd)return null;
  const t=String(raw||"").replace(/[()\s\u001d]/g,"");
  const time=new Date().toLocaleTimeString("ru-RU");
  if(/^00\d{18}$/.test(t)){ // групповой (агрегационный) код SSCC: сверка по файлу, состав внутри придёт из Xtrace
    const c=dc(curDoc);let st;
    if(curProd.gseen[t]){st="dup";curProd.dup[t]=(curProd.dup[t]||0)+1}
    else if(c.gsets[curIdx].has(t)){st="ok";curProd.gseen[t]=time}
    else if(c.gowner.has(t)){const other=curDoc.products[c.gowner.get(t)];st="bad";curProd.bad[t]={code:t,why:"пересорт: групповой код товара «"+other.name+"»",time};flash("Пересорт: групповой код товара «"+other.name+"»")}
    else{st="bad";curProd.bad[t]={code:t,why:"групповой код не из фактуры",time};flash("Группового кода нет в фактуре")}
    show(st);save();return st;
  }
  const p=parse(raw);if(!p)return null;
  const c=dc(curDoc);let st;
  if(!p.ok){st="bad";curProd.bad["len:"+p.head]={code:p.head,why:"неверная длина ("+p.len+")",time};flash("Неверная длина кода: "+p.len+" символов")}
  else if(curProd.seen[p.head]){st="dup";curProd.dup[p.head]=(curProd.dup[p.head]||0)+1}
  else if(c.sets[curIdx].has(p.head)){st="ok";curProd.seen[p.head]=time}
  else if(c.owner.has(p.head)){
    const other=curDoc.products[c.owner.get(p.head)];
    st="bad";curProd.bad[p.head]={code:p.head,why:"пересорт: это «"+other.name+"»",time};flash("Пересорт: этот код товара «"+other.name+"»");
  }else{st="bad";curProd.bad[p.head]={code:p.head,why:"нет в фактуре",time};flash("Кода нет в фактуре")}
  show(st);save();
  return st;
}

/* ---------- навигация ---------- */
const VIEWS={home:"vHome",doc:"vDoc",prod:"vProd"};
function setView(v){
  view=v;for(const k in VIEWS)$(VIEWS[k]).hidden=(k!==v);
  window.scrollTo(0,0);render(true);
}
function go(v){try{history.pushState({v},"")}catch(e){}setView(v)}
window.addEventListener("popstate",()=>{
  if(!$("camfull").hidden){closeCam();return}
  if(view==="prod")setView("doc");else if(view==="doc")setView("home");
});
const back=()=>history.back();

/* ---------- экраны ---------- */
let tab="ok";
function fmtDate(iso){try{return new Date(iso).toLocaleString("ru-RU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function render(full){
  if(curProd){const n=ps(curProd);
    $("cOk").textContent=n.ok;$("cBad").textContent=n.bad;$("cDup").textContent=n.dup;$("cLeft").textContent=n.tot-n.ok}
  if(!full&&!$("camfull").hidden)return;
  if(view==="home")renderHome();else if(view==="doc")renderDoc();else renderProd();
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
let delArm=null;
function renderHome(){
  const L=$("docList");L.innerHTML="";
  if(!docs.length){L.append(el("div","empty","нет документов"));return}
  docs.forEach(d=>{
    let tot=0,ok=0;d.products.forEach(p=>{const n=ps(p);tot+=n.tot;ok+=n.ok});
    const c=el("div","card");
    c.append(el("div","t",d.title),el("div","s",fmtDate(d.created)+" · товаров: "+d.products.length+" · проверено "+ok+" из "+tot));
    const pb=el("div","pb"+(tot&&ok===tot?" done":""));const i=document.createElement("i");i.style.width=(tot?Math.round(ok*100/tot):0)+"%";pb.append(i);c.append(pb);
    const del=el("button","sm","Удалить");del.style.marginTop="8px";
    del.onclick=e=>{e.stopPropagation();
      if(delArm!==d.id){delArm=d.id;del.textContent="Нажмите ещё раз";setTimeout(()=>{if(delArm===d.id){delArm=null;del.textContent="Удалить"}},3500);return}
      delArm=null;docs=docs.filter(x=>x!==d);cache.delete(d.id);save();renderHome()};
    c.append(del);
    c.onclick=()=>{curDoc=d;curProd=null;go("doc")};
    L.append(c);
  });
}
function renderDoc(){
  if(!curDoc)return setView("home");
  let tot=0,ok=0,bad=0;curDoc.products.forEach(p=>{const n=ps(p);tot+=n.tot;ok+=n.ok;bad+=n.bad});
  $("docName").textContent=curDoc.title;
  $("docSum").textContent="Проверено "+ok+" из "+tot+(bad?" · пересорт "+bad:"");
  const q=$("search").value.trim().toLowerCase(),L=$("prodList");L.innerHTML="";
  let shown=0;
  curDoc.products.forEach((p,i)=>{
    if(q&&p.name.toLowerCase().indexOf(q)<0)return;shown++;
    const n=ps(p);
    const r=el("div","prow"+(n.tot&&n.ok===n.tot?" done":n.bad?" err":n.ok?" part":""));
    const m=el("div","pm");m.append(el("div","pn",p.name));

/* ---------- мультискан: на кадре находятся участки с плотной «шашечной» текстурой (DataMatrix), каждый участок читается отдельно и параллельно ---------- */
/*TILES-START*/
function toGray(d,n){const g=new Uint8Array(n);for(let i=0,p=0;i<n;i++,p+=4)g[i]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8;return g}
function density(g,FW,FH){
  const bw=FW>>3,bh=FH>>3,c=new Uint16Array(bw*bh);
  for(let by=0;by<bh;by++){
    for(let bx=0;bx<bw;bx++){
      let n=0;
      for(let y=by*8,ye=y+8;y<ye;y++){
        let p=y*FW+bx*8;
        for(let x=0;x<8;x++,p++){let v=g[p],a=v-g[p+1],b=v-g[p+FW];if(a<0)a=-a;if(b<0)b=-b;if(a+b>32)n++}
      }
      c[by*bw+bx]=n;
    }
  }
  return {c,bw,bh,B:8};
}
function boxesAt(D,thr,FW,FH){
  const {c,bw,bh,B}=D,m=new Uint8Array(bw*bh),m2=new Uint8Array(bw*bh),lim=thr*B*B,out=[];
  for(let i=0;i<m.length;i++)m[i]=c[i]>lim?1:0;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    let v=0;
    for(let dy=-1;dy<=1&&!v;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<bw&&yy<bh&&m[yy*bw+xx]){v=1;break}}
    m2[y*bw+x]=v;
  }
  const seen=new Uint8Array(bw*bh);
  for(let s0=0;s0<m2.length;s0++){
    if(!m2[s0]||seen[s0])continue;
    let x0=bw,y0=bh,x1=0,y1=0;const st=[s0];seen[s0]=1;
    while(st.length){
      const i=st.pop(),x=i%bw,y=(i/bw)|0;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      const nb=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
      for(const [a,b] of nb){if(a>=0&&b>=0&&a<bw&&b<bh){const j=b*bw+a;if(m2[j]&&!seen[j]){seen[j]=1;st.push(j)}}}
    }
    const w=(x1-x0+1)*B,h=(y1-y0+1)*B,r=w/h;
    if(w<MINB||h<MINB||w>FW*0.95||h>FH*0.95||r<0.45||r>2.2)continue;
    out.push([x0*B,y0*B,w,h]);
  }
  return out;
}
let MINB=40;
function makeRegions(d,FW,FH){
  // поиск кодов идёт на уменьшенной копии (быстро), чтение кода на полном разрешении
  const sub=FW>1280?2:1,w2=Math.floor(FW/sub),h2=Math.floor(FH/sub);
  const g=new Uint8Array(w2*h2);
  for(let y=0;y<h2;y++){let p=y*sub*FW*4,o=y*w2;for(let x=0;x<w2;x++,p+=4*sub)g[o++]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8}
  MINB=Math.round(40/sub);
  const D=density(g,w2,h2);
  const all=boxesAt(D,0.28,w2,h2).concat(boxesAt(D,0.42,w2,h2)),keep=[];
  for(const b of all){
    if(keep.some(k=>Math.abs(k[0]-b[0])<k[2]*0.2&&Math.abs(k[1]-b[1])<k[3]*0.2&&Math.abs(k[2]-b[2])<k[2]*0.25))continue;
    keep.push(b);
  }
  const tiles=[];
  for(const [bx0,by0,bw1,bh1] of keep.slice(0,80)){
    const bx=bx0*sub,by=by0*sub,bw0=bw1*sub,bh0=bh1*sub;
    const mx=Math.round(bw0*0.12),my=Math.round(bh0*0.12);
    const x=Math.max(0,bx-mx),y=Math.max(0,by-my),w=Math.min(FW-x,bw0+2*mx),h=Math.min(FH-y,bh0+2*my);
    const lum=new Uint8ClampedArray(w*h);let o=0;
    for(let yy=0;yy<h;yy++){let p=((y+yy)*FW+x)*4;for(let xx=0;xx<w;xx++,p+=4)lum[o++]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8}
    tiles.push({x,y,w,h,lum});
  }
  return tiles;
}
let mainReader=null;
function decodeLocal(tiles){
  mainReader=mainReader||new ZXing.DataMatrixReader();
  const out=[];
  for(const t of tiles){
    try{
      const r=mainReader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(t.lum,t.w,t.h))));
      out.push({text:r.getText(),pts:r.getResultPoints().map(p=>[p.getX(),p.getY()]),x:t.x,y:t.y});
    }catch(e){}
  }
  return out;
}
/*TILES-END*/

const WSRC=`
let R=null;
onmessage=e=>{
  const d=e.data;
  if(d.init){try{importScripts(d.url);R=new ZXing.DataMatrixReader()}catch(err){postMessage({fail:1})}return}
  const out=[];
  if(R){for(const t of d.tiles){
    try{
      const r=R.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(t.lum,t.w,t.h))));
      out.push({text:r.getText(),pts:r.getResultPoints().map(p=>[p.getX(),p.getY()]),x:t.x,y:t.y});
    }catch(err){}
  }}
  postMessage({id:d.id,out});
};`;
let pool=[],poolOk=false,rid=0;
function initPool(){
  if(pool.length)return;
  try{
    const url=URL.createObjectURL(new Blob([WSRC],{type:"text/javascript"}));
    const n=Math.max(2,Math.min(4,(navigator.hardwareConcurrency||4)-1));
    const zx=new URL("zxing.min.js",location.href).href;
    for(let i=0;i<n;i++){
      const w=new Worker(url);
      w.onerror=()=>{poolOk=false};
      w.addEventListener("message",e=>{if(e.data&&e.data.fail)poolOk=false});
      w.postMessage({init:1,url:zx});pool.push(w);
    }
    poolOk=true;
  }catch(e){poolOk=false}
}
function runTiles(tiles){
  if(!poolOk)return Promise.resolve(decodeLocal(tiles));
  return new Promise(res=>{
    const id=++rid,n=pool.length,parts=Array.from({length:n},()=>[]);
    tiles.forEach((t,i)=>parts[i%n].push(t));
    let left=0,all=[];
    const timer=setTimeout(()=>res(all),1500);
    pool.forEach((w,i)=>{
      if(!parts[i].length)return;left++;
      w.onmessage=e=>{
        if(e.data.fail){poolOk=false;return}
        if(e.data.id!==id)return;
        all=all.concat(e.data.out);
        if(--left===0){clearTimeout(timer);res(all)}
      };
      w.postMessage({id,tiles:parts[i]},parts[i].map(t=>t.lum.buffer));
    });
    if(!left){clearTimeout(timer);res(all)}
  });
}

/* ---------- отслеживание кодов в кадре и подсветка ---------- */
const trk=new Map(); // ключ кода -> {st,box,t}
const HLC={ok:"31,157,85",bad:"214,69,69",dup:"232,180,0",grp:"59,130,246"};
const RANK={grp:0,ok:1,dup:2,bad:3};
function onResults(out,FW,vw){
  const k=vw/FW,now=Date.now(),done=new Set();
  let worst=null;
  for(const r of out){
    if(done.has(r.text))continue;done.add(r.text);
    const p=parse(r.text);if(!p)continue;
    const key=p.ok?p.head:"x"+r.text;
    const xs=r.pts.map(q=>(r.x+q[0])*k),ys=r.pts.map(q=>(r.y+q[1])*k);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),pad=(x1-x0)*0.06;
    const box=[x0-pad,y0-pad,x1+pad,y1+pad];
    const e=trk.get(key);
    if(e&&now-e.t<1200){e.t=now;e.box=box;continue} // тот же код всё ещё в кадре
    const st=check(r.text);if(!st)continue;
    trk.set(key,{st,box,t:now});
    if(!worst||RANK[st]>RANK[worst])worst=st;
  }
  if(worst){feedback(worst);render()}
  trk.forEach((e,key)=>{if(now-e.t>3000)trk.delete(key)});
  return done.size;
}
function drawHL(){
  const c=$("hl"),v=$("video"),cw=c.clientWidth,ch=c.clientHeight;
  if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}
  const g=c.getContext("2d");g.clearRect(0,0,cw,ch);
  const vw=v.videoWidth,vh=v.videoHeight,now=Date.now();
  const k=vw?Math.max(cw/vw,ch/vh):1,ox=vw?(cw-vw*k)/2:0,oy=vw?(ch-vh*k)/2:0;
  trk.forEach(e=>{
    if(now-e.t>450||!HLC[e.st]||!e.box)return;
    let x,y,w,h;
    if(e.css){x=e.box[0];y=e.box[1];w=e.box[2]-e.box[0];h=e.box[3]-e.box[1]}
    else{if(!vw)return;x=ox+e.box[0]*k;y=oy+e.box[1]*k;w=(e.box[2]-e.box[0])*k;h=(e.box[3]-e.box[1])*k}
    const pad=Math.max(4,w*0.05);x-=pad;y-=pad;w+=2*pad;h+=2*pad;
    g.fillStyle="rgba("+HLC[e.st]+",.45)";g.fillRect(x,y,w,h);
    g.lineWidth=5;g.strokeStyle="rgb("+HLC[e.st]+")";g.strokeRect(x,y,w,h);
  });
}

/* ---------- камера на весь экран ---------- */
let stream=null,track=null,running=false,torchOn=false,cv=null,cx=null,wake=null;
async function loop(){
  let frames=0,fpsT=Date.now(),inFrame=0;
  while(running){
    const v=$("video");
    if(v.videoWidth){
      const FW=Math.min(+$("qual").value,v.videoWidth),FH=Math.round(FW*v.videoHeight/v.videoWidth);
      if(cv.width!==FW||cv.height!==FH){cv.width=FW;cv.height=FH}
      cx.drawImage(v,0,0,FW,FH);
      const tiles=makeRegions(cx.getImageData(0,0,FW,FH).data,FW,FH);
      let out=[];
      try{out=await runTiles(tiles)}catch(e){}
      if(!running)break;
      inFrame=onResults(out,FW,v.videoWidth);
      drawHL();
      frames++;
      const now=Date.now();
      if(now-fpsT>=1000){$("dbg").textContent="Кадров в секунду: "+frames+" · кодов в кадре: "+inFrame+(poolOk?"":" · режим без потоков");frames=0;fpsT=now}
    }
    await new Promise(r=>setTimeout(r,0));
  }
}
async function camStart(){
  $("camMsg").textContent="";
  try{
    if(!window.ZXing)throw new Error("библиотека распознавания не загрузилась");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});
    const v=$("video");v.srcObject=stream;await v.play();
    track=stream.getVideoTracks()[0];
    try{const cap=track.getCapabilities?track.getCapabilities():{};
      if(cap.focusMode&&cap.focusMode.includes("continuous"))await track.applyConstraints({advanced:[{focusMode:"continuous"}]});
      $("btnTorch").hidden=!cap.torch}catch(e){}
    cv=document.createElement("canvas");cx=cv.getContext("2d",{willReadFrequently:true});
    initPool();
    try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}
    show("idle");running=true;loop();
  }catch(e){
    camStop();$("camMsg").textContent="Камера не запустилась: "+(e&&e.message?e.message:e)+". Проверьте разрешение камеры в настройках телефона.";
  }
}
function camStop(){
  running=false;torchOn=false;trk.clear();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  track=null;$("video").srcObject=null;$("btnTorch").hidden=true;
  try{wake&&wake.release()}catch(e){}wake=null;
  const c=$("hl");c.getContext("2d").clearRect(0,0,c.width,c.height);
}
/* ---------- встроенный распознаватель Android (ML Kit): читает много кодов за кадр ---------- */
const NSC=()=>window.NativeScanner&&window.NativeScanner.isNative?window.NativeScanner.BarcodeScanner:null;
let nativeOn=false,nativeTimer=null;
function onNative(ev){
  const arr=(ev&&ev.barcodes)||[],dpr=window.devicePixelRatio||1,now=Date.now(),done=new Set();
  let worst=null,first="";
  for(const b of arr){
    const text=b.rawValue||b.displayValue||"";
    if(!text||done.has(text))continue;
    if(b.format==="CODE_128"&&!/^00\d{18}$/.test(text.replace(/[()\s\u001d]/g,"")))continue;
    done.add(text);
    if(!first)first=text;
    const p=parse(text);if(!p)continue;
    const key=p.ok?p.head:"x"+text;
    let box=null;
    if(b.cornerPoints&&b.cornerPoints.length){
      const xs=b.cornerPoints.map(q=>q[0]/dpr),ys=b.cornerPoints.map(q=>q[1]/dpr);
      box=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
    }
    const e=trk.get(key);
    if(e&&now-e.t<1200){e.t=now;if(box)e.box=box;continue}
    const st=check(text);if(!st)continue;
    trk.set(key,{st,box,t:now,css:true});
    if(!worst||RANK[st]>RANK[worst])worst=st;
  }
  if(worst){feedback(worst);render()}
  trk.forEach((e,key)=>{if(now-e.t>3000)trk.delete(key)});
  $("dbg").textContent="Кодов в кадре: "+done.size+(first?" · длина "+first.length+", разделитель: "+(first.indexOf("\u001d")>=0?"есть":"нет"):"");
  drawHL();
}
async function nativeStart(){
  const BS=NSC();$("camMsg").textContent="";
  try{
    let p=await BS.checkPermissions();
    if(p.camera!=="granted")p=await BS.requestPermissions();
    if(p.camera!=="granted")throw new Error("нет разрешения на камеру");
    document.documentElement.classList.add("barcode-scanner-active");document.body.classList.add("barcode-scanner-active");
    $("qual").hidden=true;
    await BS.addListener("barcodesScanned",onNative);
    await BS.startScan({formats:["DATA_MATRIX","CODE_128"],lensFacing:"BACK"});
    nativeOn=true;nativeTimer=setInterval(drawHL,120);
    try{const t=await BS.isTorchAvailable();$("btnTorch").hidden=!t.available}catch(e){}
    try{
      const mn=(await BS.getMinZoomRatio()).zoomRatio,mx=(await BS.getMaxZoomRatio()).zoomRatio,z=$("zoom");
      z.min=mn;z.max=Math.min(mx,8);z.value=mn;z.hidden=false;
    }catch(e){}
  }catch(e){
    await nativeStop();$("camfull").hidden=false;
    $("camMsg").textContent="Камера не запустилась: "+(e&&e.message?e.message:e)+". Проверьте разрешение камеры в настройках телефона.";
  }
}
async function nativeStop(){
  const BS=NSC();
  if(nativeTimer){clearInterval(nativeTimer);nativeTimer=null}
  nativeOn=false;trk.clear();
  try{await BS.stopScan()}catch(e){}
  try{await BS.removeAllListeners()}catch(e){}
  document.documentElement.classList.remove("barcode-scanner-active");document.body.classList.remove("barcode-scanner-active");
  $("btnTorch").hidden=true;$("zoom").hidden=true;$("qual").hidden=false;
  const c=$("hl");c.getContext("2d").clearRect(0,0,c.width,c.height);
}

$("btnTorch").onclick=async()=>{
  const BS=NSC();
  if(BS&&nativeOn){try{await BS.toggleTorch()}catch(e){}return}
  try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]})}catch(e){}
};
$("zoom").oninput=()=>{const BS=NSC();if(BS&&nativeOn)BS.setZoomRatio({zoomRatio:+$("zoom").value}).catch(()=>{})};


/* ---------- загрузка фактуры и кнопки ---------- */
function loadText(text,title){
  const d=createDoc(text,title);
  if(!d){$("loadMsg").textContent="В тексте не найдено ни товаров, ни кодов. Проверьте формат.";return}
  const n=d.products.reduce((a,p)=>a+p.codes.length,0);
  $("loadMsg").textContent="";$("invoice").value="";$("docTitle").value="";
  toast("Документ создан: товаров "+d.products.length+", кодов "+n);
  curDoc=d;curProd=null;go("doc");
}
$("btnLoad").onclick=()=>loadText($("invoice").value,$("docTitle").value.trim());
$("btnFile").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const t=r.result;$("invoice").value=t;loadText(t,$("docTitle").value.trim()||f.name.replace(/\.[^.]+$/,""))};r.readAsText(f);e.target.value=""};
$("bkHome").onclick=back;$("bkDoc").onclick=back;
$("search").addEventListener("input",()=>renderDoc());
$("btnScanProd").onclick=openCam;
$("code").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const v=$("code").value;$("code").value="";const st=check(v);if(st){feedback(st);render(true)}}});
setView("home");
</script>
</body>
</html>
